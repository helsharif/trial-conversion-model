# note, the EC2 has to be running, and the Public IP4 address is the EC2_HOST environment variable that needs to be updated in Github
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # The model artifact is not in git; the service cannot exist without
      # it. CI pulls the published model from S3, exactly like production
      # will, BEFORE the tests run (the API loads the model at import).
      - name: Pull the published model from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
        run: >
          uv run python -c "import boto3;
          boto3.client('s3').download_file(
          'futureproofds-trial-conversion-artifacts-bucket-001',
          'models/model.json', 'models/model.json')"

      - name: Test
        run: uv run pytest

      - name: Build the service image
        run: docker build -t trial-conversion-model:${{ github.sha }} .

  publish:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Pull the published model from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
        run: >
          uv run --with boto3 python -c "import boto3;
          boto3.client('s3').download_file(
          'futureproofds-trial-conversion-artifacts-bucket-001',
          'models/model.json', 'models/model.json')"

      # The registry is where CI hands the image to the server. The
      # PERSONAL_ACCESS_TOKEN_GITHUB authenticates the push; no extra secrets needed.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PERSONAL_ACCESS_TOKEN_GITHUB }}

      - name: Build and push both images
        run: |
          IMAGE=ghcr.io/<your-github-username>/trial-conversion-model
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          # The jobs image ships with every push, the same way the API's does.
          docker build -f Dockerfile.jobs -t $IMAGE-jobs:latest -t $IMAGE-jobs:${{ github.sha }} .
          docker push $IMAGE-jobs:latest
          docker push $IMAGE-jobs:${{ github.sha }}

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The same three commands a human runs for a manual deploy,
      # executed by GitHub over SSH on every push to main.
      - name: Restart the service on EC2 with the new image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Cron starts a container from this image every morning, so the
            # pull here is what puts a pushed change into tomorrow's run.
            sudo docker pull ghcr.io/helsharif/trial-conversion-model-jobs:latest
            sudo docker pull ghcr.io/helsharif/trial-conversion-model:latest
            sudo docker rm -f trial-conversion || true
            sudo docker run -d --restart unless-stopped --name trial-conversion -p 8000:8000 ghcr.io/helsharif/trial-conversion-model:latest
